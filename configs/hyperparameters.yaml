# ============================================================
# HKB-BV: Hyperparameter Configuration
# Tuned values optimised for fingerprint verification in EA
# recruitment scenarios
# ============================================================

# ============================================================
# ResNet-18 Matcher Architecture
# ============================================================
matcher:
  # Model architecture
  pretrained: true
  embedding_dim: 512
  num_classes: 2  # Genuine (0), Impostor (1)
  input_size: [224, 224]
  num_channels: 1  # Grayscale fingerprint images
  
  # Normalisation
  batch_norm_momentum: 0.1
  l2_normalize_embeddings: true
  
  # Device
  device: 'cuda'  # 'cuda' or 'cpu'

# ============================================================
# Training Configuration
# ============================================================
training:
  # Core hyperparameters (tuned via Bayesian optimisation)
  num_epochs: 100
  batch_size: 32
  learning_rate: 2.0e-4  # Tuned via grid search [1e-4, 5e-4]
  weight_decay: 1.0e-4   # L2 regularisation
  momentum: 0.9
  
  # Loss function (triplet loss shows best performance)
  loss_function: 'triplet'  # Options: 'triplet', 'contrastive', 'cosine'
  triplet_margin: 0.5       # Tuned margin (tested: 0.3, 0.5, 0.7)
  contrastive_margin: 1.0
  
  # Optimiser configuration
  optimiser: 'adam'  # Options: 'adam', 'adamw', 'sgd'
  
  # Learning rate scheduling
  scheduler: 'cosine'  # Options: 'cosine', 'step', 'exponential', null
  
  # Early stopping (validated on Synthetic PSRS)
  use_early_stopping: true
  patience: 10  # Stop if val loss doesn't improve for 10 epochs
  
  # Checkpointing
  checkpoint_dir: './checkpoints/'
  save_best_only: true
  save_frequency: 5  # Save checkpoint every 5 epochs
  
  # Data splitting
  train_ratio: 0.6
  val_ratio: 0.2
  test_ratio: 0.2
  subject_disjoint: true  # Enforce subject-disjoint splits
  random_seed: 42
  
  # Logging
  use_wandb: false  # Set to true if wandb is installed
  wandb_project: 'hkb-bv'
  log_interval: 10

# ============================================================
# Data Preprocessing Configuration
# ============================================================
preprocessing:
  # Image normalisation
  target_size: [224, 224]
  target_dpi: 500
  normalize_method: 'minmax'  # Options: 'minmax', 'zscore', 'histogram'
  
  # Contrast enhancement (CLAHE)
  apply_clahe: true
  clahe_clip_limit: 2.0       # Tuned value (tested: 1.5, 2.0, 3.0)
  clahe_tile_size: [8, 8]
  
  # Ridge enhancement (Gabor filters)
  apply_ridge_enhancement: true
  ridge_filter_sigma: 1.5     # Tuned for EA fingerprints
  
  # Optional Gaussian blur
  apply_gaussian_blur: false
  gaussian_kernel: [3, 3]
  gaussian_sigma: 0.5
  
  # Data augmentation (training only)
  augmentation_probability: 0.5
  rotation_range: [-15, 15]   # Degrees
  shear_range: [-0.1, 0.1]    # Proportional
  translation_range: [-0.1, 0.1]
  noise_std: 0.02             # Gaussian noise std
  
  # Output
  output_dtype: 'float32'
  output_range: [0.0, 1.0]

# ============================================================
# Fuzzy Liveness Detection Configuration
# ============================================================
fuzzy_liveness:
  # Fuzzy logic parameters (tuned via ablation study)
  pore_weight: 0.4      # Weight for pore density (optimal: 0.4)
  ridge_weight: 0.6     # Weight for ridge quality (optimal: 0.6)
  
  # Membership function parameters
  # Triangular fuzzy sets for low, medium, high
  pore_density:
    low: [0.0, 0.0, 0.3]      # (a, b, c) triangle
    medium: [0.2, 0.5, 0.8]
    high: [0.7, 1.0, 1.0]
  
  ridge_quality:
    low: [0.0, 0.0, 0.3]
    medium: [0.2, 0.5, 0.8]
    high: [0.7, 1.0, 1.0]
  
  # Defuzzification method
  defuzzification: 'centroid'  # Options: 'centroid', 'bisector', 'mom'
  
  # Liveness decision threshold
  liveness_threshold: 0.65     # Gate before matcher (tuned on LivDet 2021)

# ============================================================
# SWRL Rule Configuration
# ============================================================
swrl_rules:
  # Velocity anomaly rule
  velocity:
    enabled: true
    threshold_attempts: 3       # Attempts within 1 hour
    time_window_minutes: 60
    fraud_mass: 0.85            # DS belief mass if triggered
  
  # Impossible travel (geospatial conflict)
  impossible_travel:
    enabled: true
    min_distance_km: 50         # Minimum distance to trigger
    time_window_minutes: 30
    fraud_mass: 0.92
  
  # Duplicate submission
  duplicate_submission:
    enabled: true
    similarity_threshold: 0.95  # Fingerprint matching threshold
    fraud_mass: 0.75
  
  # Document verification
  document_verification:
    enabled: true
    fraud_mass: 0.80
  
  # Rule execution
  execute_all_rules: true       # Execute all applicable rules
  rule_timeout_ms: 5000         # Max time per rule evaluation

# ============================================================
# Dempster–Shafer Evidence Fusion Configuration
# ============================================================
dempster_shafer:
  # Trade-off parameters (tuned via cross-validation)
  lambda_param: 0.3             # Balances DL and KB evidence
  
  # Conflict handling
  conflict_threshold_tau_k: 0.5 # Threshold for high conflict
  uncertainty_assignment: true  # Assign to uncertainty on high conflict
  
  # Similarity metrics for belief mass computation
  similarity_metric: 'cosine'   # Options: 'cosine', 'euclidean'
  
  # Belief mass normalisation
  normalise_masses: true
  
  # Conflict resolution strategy
  conflict_resolution: 'uncertainty'  # Options: 'uncertainty', 'weighted_average'

# ============================================================
# Decision Thresholds (see thresholds.yaml for details)
# ============================================================
thresholds:
  # Primary verification threshold
  tau_star: 0.65              # DS fusion belief threshold (tuned on val set)
  
  # Liveness decision threshold
  tau_liveness: 0.65          # Liveness score threshold
  
  # DS conflict threshold
  tau_conflict_k: 0.5         # Conflict degree threshold for audit tracing

# ============================================================
# FAISS Indexing Configuration (Scalability)
# ============================================================
faiss_indexing:
  # Index type for 1:N retrieval
  index_type: 'IVF'           # Inverted File for large galleries
  
  # Clustering parameters
  num_clusters: 100           # IVF centroids (tuned for 10^6-10^7 scale)
  nprobe: 8                   # Number of clusters to probe
  
  # Quantisation (reduce memory)
  use_pq: true                # Product Quantisation
  num_pq_bytes: 16            # Bytes per vector after PQ
  
  # Batch retrieval
  batch_size: 1000            # Probe batch size for memory efficiency
  top_k: 1                    # Return only top-1 match

# ============================================================
# Network & Communication Configuration
# ============================================================
network:
  # TLS/mTLS settings
  use_mtls: true
  tls_version: '1.3'
  certificate_path: './certs/server.crt'
  private_key_path: './certs/server.key'
  
  # Timeout settings
  connection_timeout_s: 10
  read_timeout_s: 30
  write_timeout_s: 30
  
  # Retry logic
  max_retries: 3
  retry_backoff_s: 2

# ============================================================
# Logging & Monitoring Configuration
# ============================================================
logging:
  # Log level
  level: 'INFO'  # Options: DEBUG, INFO, WARNING, ERROR, CRITICAL
  
  # Output format
  format: 'json'  # Options: 'json', 'text'
  
  # File logging
  log_file: './logs/hkb_bv.log'
  max_file_size_mb: 100
  backup_count: 5
  
  # Audit logging (PDPA-compliant)
  audit_log_file: './logs/audit.log'
  audit_enabled: true

# ============================================================
# Performance Tuning (Advanced)
# ============================================================
performance:
  # GPU memory optimisation
  mixed_precision: true       # Use FP16 where possible
  gradient_checkpointing: false
  
  # Data loading
  num_workers: 4              # DataLoader workers
  pin_memory: true            # Pinned memory for faster transfer
  
  # Gradient clipping
  clip_grad_norm: 1.0
  
  # Batch accumulation (if memory-constrained)
  accumulation_steps: 1       # 1 = no accumulation

# ============================================================
# Experiment Tracking (Weights & Biases)
# ============================================================
experiment:
  project_name: 'hkb-bv-recruitment'
  experiment_name: 'hybrid-kb-biometric-ea'
  tags:
    - 'biometric-verification'
    - 'iot-edge'
    - 'knowledge-based'
    - 'east-africa'
  
  # Artifact tracking
  save_best_model: true
  save_frequency_epochs: 5
