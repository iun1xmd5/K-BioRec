# ============================================================
# HKB-BV: Deployment Configuration
# Edge (ESP32) and Backend Infrastructure Setup
# ============================================================

# ============================================================
# ESP32 Edge Device Configuration
# ============================================================
esp32_edge:
  # Device specifications
  microcontroller: 'ESP32-WROOM-32'
  cpu_cores: 2
  cpu_frequency_mhz: 240
  ram_mb: 520  # SRAM available
  flash_mb: 4096
  
  # Fingerprint sensor
  sensor:
    model: 'R307'
    resolution_dpi: 500
    image_size: [256, 360]  # Pixels
    interface: 'UART'
    baud_rate: 57600
    timeout_ms: 5000
  
  # Network connectivity
  wifi:
    enabled: true
    standard: '802.11 b/g/n'
    security: 'WPA3'
    ssid: '${WIFI_SSID}'
    password: '${WIFI_PASSWORD}'
    connection_timeout_s: 10
    retry_count: 3
  
  cellular:
    enabled: false  # Optional: SIM800L module
    module: 'SIM800L'
    apn: '${CELLULAR_APN}'
    fallback_enabled: true
  
  # TLS/mTLS configuration
  tls:
    enabled: true
    version: 'TLS 1.3'
    certificate_path: '/certs/client.crt'
    private_key_path: '/certs/client.key'
    ca_certificate_path: '/certs/ca.crt'
    verify_server: true
    cipher_suites:
      - 'TLS_ECDHE_RSA_WITH_AES_256_GCM_SHA384'
      - 'TLS_ECDHE_RSA_WITH_CHACHA20_POLY1305'
  
  # Minutiae extraction (on-device CNN)
  minutiae_extraction:
    model: 'resnet18_edge_quantized'  # Quantised for ESP32
    input_size: [224, 224]
    output_dim: 512
    quantization: 'int8'
    model_size_kb: 8192  # ~8 MB
    inference_time_ms: 450  # Typical inference time
  
  # Fuzzy liveness detection
  liveness:
    method: 'fuzzy_rules'
    features: ['pore_density', 'ridge_quality']
    pore_weight: 0.4
    ridge_weight: 0.6
    threshold: 0.65
    fuzzy_inference_time_ms: 50
  
  # Memory management
  memory:
    model_buffer_mb: 8
    inference_buffer_mb: 2
    sensor_buffer_mb: 1
    temporary_storage_mb: 2
    total_available_mb: 13  # Conservative estimate
  
  # Power management
  power:
    deep_sleep_enabled: true
    wifi_sleep_duration_s: 30
    sensor_power_consumption_ma: 120
    cpu_power_consumption_ma: 80
    estimated_battery_life_hours: 24  # With 2000 mAh battery
  
  # Logging and diagnostics
  logging:
    enabled: true
    level: 'INFO'  # DEBUG, INFO, WARNING, ERROR
    output: 'serial'  # 'serial' or 'flash_storage'
    max_log_size_kb: 512
    include_timestamps: true
    include_latency_metrics: true

# ============================================================
# Backend Server Configuration
# ============================================================
backend:
  # Server specifications
  framework: 'Flask'
  wsgi_server: 'Gunicorn'
  workers: 4
  threads_per_worker: 2
  host: '0.0.0.0'
  port: 5000
  debug: false  # Never enable in production
  
  # API endpoints
  api:
    version: 'v1'
    base_path: '/api/v1'
    endpoints:
      - path: '/verify'
        method: 'POST'
        requires_auth: true
        timeout_s: 30
      - path: '/enroll'
        method: 'POST'
        requires_auth: true
        requires_admin: true
        timeout_s: 60
      - path: '/health'
        method: 'GET'
        requires_auth: false
        timeout_s: 5
      - path: '/audit-log'
        method: 'GET'
        requires_auth: true
        requires_admin: true
        timeout_s: 10
  
  # Authentication
  authentication:
    method: 'JWT'
    algorithm: 'RS256'
    secret_key: '${JWT_SECRET_KEY}'
    token_expiry_hours: 24
    refresh_token_expiry_days: 7
    require_mTLS: true
  
  # TLS/mTLS
  tls:
    enabled: true
    version: 'TLS 1.3'
    certificate_path: '/etc/ssl/certs/server.crt'
    private_key_path: '/etc/ssl/private/server.key'
    ca_certificate_path: '/etc/ssl/certs/ca.crt'
    require_client_cert: true  # mTLS
    min_tls_version: '1.3'
    strong_ciphers_only: true

# ============================================================
# Database Configuration (PostgreSQL)
# ============================================================
database:
  engine: 'PostgreSQL'
  host: '${DB_HOST}'
  port: 5432
  database: 'hkb_bv_recruitment'
  user: '${DB_USER}'
  password: '${DB_PASSWORD}'
  
  # Connection pooling
  pool:
    min_size: 5
    max_size: 20
    timeout_s: 10
    recycle_s: 3600
  
  # Tables
  tables:
    - name: 'candidates'
      description: 'Candidate enrollment records'
      encryption: 'PII columns encrypted with AES-256'
    
    - name: 'biometric_templates'
      description: 'Hashed fingerprint embeddings'
      encryption: 'Argon2-hashed; plaintext never stored'
    
    - name: 'verification_logs'
      description: 'Immutable audit trail of all verification events'
      encryption: 'Tamper-evident logging enabled'
      retention_days: 2555  # 7 years per EA PDPA/DPA
    
    - name: 'ontology_cache'
      description: 'SWRL rule cache for fraud detection'
      encryption: 'Not encrypted (rules are not sensitive)'
      ttl_hours: 24
  
  # Backup
  backup:
    enabled: true
    frequency: 'daily'
    time_utc: '02:00'
    retention_days: 90
    encryption: 'AES-256'
    destination: '${BACKUP_BUCKET_S3}'

# ============================================================
# FAISS Indexing Configuration (Scalability)
# ============================================================
faiss_indexing:
  # Index parameters
  index_type: 'IVF'  # Inverted File for large-scale galleries
  embedding_dim: 512
  num_clusters: 100
  nprobe: 8  # Clusters to probe per query
  
  # Quantisation for memory efficiency
  quantization:
    enabled: true
    method: 'PQ'  # Product Quantisation
    num_bytes: 16  # 16 bytes per vector (~2 GB for 10^7)
    training_size: 100000  # Vectors used to train quantiser
  
  # Index management
  index_file_path: '/data/indices/nia_gallery.faiss'
  index_metadata_path: '/data/indices/nia_gallery.meta'
  rebuild_schedule: 'weekly'
  rebuild_time_utc: '03:00'
  
  # Query performance
  batch_query_size: 1000
  timeout_per_query_ms: 1000
  max_results_per_query: 1

# ============
